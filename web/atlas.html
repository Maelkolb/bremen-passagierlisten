<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas der Auswanderung</title>
    <meta name="description" content="Interaktiver Atlas zu den Bremer Passagierlisten 1830–1939: woher die Reisenden kamen, wohin sie wollten und welche Wege sich wiederholten, mit Namenssuche und Rundgang." />
    <meta name="theme-color" content="#f3f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3f3ef'/%3E%3Cpath d='M6 9h20M6 15h20M6 21h20M6 27h20' stroke='%239fb3bf' stroke-width='1.5'/%3E%3Cpath d='M10 4v28M13 4v28' stroke='%23b8352d' stroke-width='1.5'/%3E%3C/svg%3E" />
  </head>
  <body class="atlas-page">
    <header class="atlas-bar">
      <div class="atlas-brand">
        <a href="index.html" class="atlas-home">Bremer Passagierlisten</a>
        <h1 class="atlas-title">Atlas der Auswanderung</h1>
      </div>
      <nav class="view-switch" id="views" role="tablist" aria-label="Ansicht"></nav>
      <button type="button" class="button secondary tour-button" id="tour-start">Rundgang</button>
    </header>
    <div class="atlas-body">
      <aside class="atlas-panel" id="panel" aria-label="Suche und Auswertung">
        <button type="button" class="sheet-handle" id="panel-handle" aria-expanded="false"></button>
        <div class="panel-search" id="search"></div>
        <div class="panel-body" id="panel-body"></div>
      </aside>
      <main class="atlas-stage">
        <div class="map-wrap">
          <div class="atlas-map" id="map"></div>
          <div class="map-tooltip" id="tooltip" hidden></div>
          <div class="atlas-year" id="year-overlay" aria-hidden="true"></div>
          <div class="atlas-legend" id="legend"></div>
          <div class="tour-card" id="tour" hidden></div>
        </div>
        <div class="atlas-timeline" id="timeline"></div>
      </main>
    </div>
    <script type="module" src="/src/atlas/main.ts"></script>
  </body>
</html>
