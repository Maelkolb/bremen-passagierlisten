<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas der Auswanderung</title>
    <meta name="description" content="Interaktiver Atlas zu 735.545 Einträgen der Bremer Passagierlisten 1830–1939: Herkunft, Ziele, Wege, Kettenmigration und Wandel, mit Rundgang und Ortsprofilen." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314213d'/%3E%3Cpath d='M6 21h20l-3 5H9z' fill='%23c87d55'/%3E%3Cpath d='M15 5v14h-8z' fill='%23f9f6f0'/%3E%3Cpath d='M17 8v11h7z' fill='%23f9f6f0'/%3E%3C/svg%3E" />
  </head>
  <body class="atlas-page">
    <header class="atlas-bar">
      <a href="index.html" class="atlas-brand">Bremer Passagierlisten</a>
      <h1 class="atlas-title">Atlas der Auswanderung</h1>
      <nav class="atlas-lenses" id="lenses" aria-label="Ansicht"></nav>
      <div class="atlas-actions">
        <button type="button" class="button secondary" id="tour-start">Rundgang</button>
        <nav class="atlas-links" aria-label="Weitere Seiten">
          <a href="index.html#reportage">Reportage</a>
          <a href="index.html#werkbank">Werkbank</a>
          <a href="bericht.html">Bericht</a>
        </nav>
      </div>
    </header>
    <div class="atlas-body">
      <aside class="atlas-panel" id="panel" aria-label="Filter und Auswertung">
        <button type="button" class="panel-toggle" id="panel-toggle" aria-expanded="false">Filter und Auswertung</button>
        <div class="panel-scroll">
          <section class="panel-section" id="panel-status"></section>
          <section class="panel-section" id="panel-filters"></section>
          <section class="panel-section" id="panel-lens"></section>
        </div>
      </aside>
      <main class="atlas-stage">
        <div class="atlas-map" id="map"></div>
        <div class="map-tooltip" id="tooltip" hidden></div>
        <div class="atlas-year" id="year-overlay" aria-hidden="true"></div>
        <div class="atlas-legend" id="legend"></div>
        <div class="tour-card" id="tour" hidden></div>
        <div class="atlas-timeline" id="timeline"></div>
      </main>
    </div>
    <script type="module" src="/src/atlas/main.ts"></script>
  </body>
</html>
